name: Scan BOAMP quotidien

on:
  schedule:
    # Tous les jours à 7h00 heure de Paris (6h00 UTC en hiver, 5h00 UTC en été)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permet de lancer le scan manuellement depuis l'onglet Actions

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nécessaire pour committer seen_ids.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Lancer le scan et envoyer l'email si besoin
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python boamp_scan.py

      - name: Sauvegarder les avis déjà vus
        run: |
          git config user.name "radar-reflex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "Mise à jour des avis suivis"
          git push
